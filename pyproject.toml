[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doorway-agi"
version = "0.1.0"
description = "The first AI reasoning engine derived from human cognition. Gap detection. Geometric bridging. Verifiable reasoning."
authors = [{name = "Luke H"}]
maintainers = [{name = "Doorway"}]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "xycore",
    "pruv",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.urls]
Homepage = "https://doorwayagi.com"
Repository = "https://github.com/doorwayagi/doorway"
