[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doorway-agi"
version = "0.3.0"
description = "The first AI reasoning engine derived from human cognition. Gap detection. Geometric bridging. Verifiable reasoning."
readme = "README.md"
authors = [{name = "Luke H"}]
maintainers = [{name = "Doorway"}]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "xycore",
    "pruv",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.scripts]
doorway = "doorway.cli:main"

[project.urls]
Homepage = "https://doorwayagi.com"
Repository = "https://github.com/doorwayagi/doorway"

[tool.setuptools.packages.find]
include = ["doorway*"]
