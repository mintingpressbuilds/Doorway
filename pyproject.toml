[build-system]
requires = ["setuptools>=68.0,<75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doorway-agi"
version = "0.1.0"
description = "The first AI reasoning engine derived from human cognition. Gap detection. Geometric bridging. Verifiable reasoning."
authors = [{name = "Luke H"}]
maintainers = [{name = "Doorway"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "xycore",
    "pruv",
    "python-dotenv",
    "fastapi",
    "uvicorn",
]

[project.scripts]
doorway = "doorway.cli:main"

[project.urls]
Homepage = "https://doorwayagi.com"
Repository = "https://github.com/doorwayagi/doorway"

[tool.setuptools.packages.find]
include = ["doorway*"]
